<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>全能刷题工具 · PWA</title>
<link rel="manifest" id="manifest-link">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f7fa; color: #333; }
  .hidden { display: none !important; }
  .container { max-width: 800px; margin: 0 auto; padding: 16px; }

  .config-card {
    background: white; padding: 20px; border-radius: 12px; margin-top: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .config-card input, .config-card button {
    width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; border-radius: 8px; border: 1px solid #ddd;
  }
  .config-card button {
    background: #0052d9; color: white; border: none; font-weight: bold;
  }
  .config-card .info-text { font-size: 14px; color: #666; margin: 8px 0; }
  .debug-box {
    margin-top: 12px; padding: 10px; background: #fff3cd; border: 1px solid #ffc107;
    border-radius: 8px; font-size: 13px; white-space: pre-wrap; max-height: 200px; overflow: auto;
  }

  .stats { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .stat-item {
    background: white; padding: 6px 14px; border-radius: 20px; font-size: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .progress { flex: 1; height: 12px; background: #e0e0e0; border-radius: 10px; overflow: hidden; }
  .progress-bar { height: 100%; background: #0052d9; transition: width 0.3s; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .toolbar button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid #0052d9; background: white; color: #0052d9;
    font-size: 14px; cursor: pointer;
  }
  .toolbar button.active { background: #0052d9; color: white; }

  .card {
    background: white; padding: 20px; border-radius: 12px; margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .q-header { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .q-type { padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 14px; }
  .q-title { font-size: 18px; line-height: 1.6; margin-bottom: 16px; }

  .option {
    border: 1px solid #e5e6eb; border-radius: 8px; padding: 12px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s;
  }
  .option.selected { border-color: #0052d9; background: #e8f3ff; }
  .option.correct { border-color: #2ba471; background: #e8f8f0; }
  .option.wrong { border-color: #d54941; background: #fdecec; }
  .option-key {
    width: 28px; height: 28px; border-radius: 50%; background: #f5f7fa; display: flex;
    align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0;
  }
  .option.selected .option-key { background: #0052d9; color: white; }
  .option.correct .option-key { background: #2ba471; color: white; }
  .option.wrong .option-key { background: #d54941; color: white; }

  .btn-row { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
  .btn { padding: 12px 24px; border-radius: 8px; border: none; font-size: 16px; cursor: pointer; }
  .btn-primary { background: #0052d9; color: white; }
  .btn-secondary { background: white; color: #0052d9; border: 1px solid #0052d9; }

  .notes-panel { margin-top: 20px; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; background: #fafafa; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white;
           padding: 10px 24px; border-radius: 20px; z-index: 1000; opacity: 0; transition: 0.3s; }
  .toast.show { opacity: 1; }

  @media (max-width: 480px) {
    .container { padding: 10px; }
    .btn { padding: 10px 18px; font-size: 14px; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <!-- 配置界面（用户名和仓库名已固定） -->
  <div id="configPanel" class="config-card">
    <h2>⚙️ 连接 GitHub 同步</h2>
    <p class="info-text">题库与做题记录将保存在 <b>WIO237/wy-quiz</b> 仓库中。</p>
    <input type="hidden" id="ghOwner" value="WIO237">
    <input type="hidden" id="ghRepo" value="wy-quiz">
    
    <label style="font-weight: bold; display: block; margin-top: 10px;">Personal Access Token</label>
    <input type="password" id="ghToken" placeholder="请输入您的 GitHub Token" autocomplete="off">
    <button id="connectBtn">连接并加载题库</button>
    <p style="font-size:12px;color:#999;margin-top:10px;">
      Token 仅在您的浏览器本地保存，不会上传。首次输入后自动记住。
    </p>
    <!-- 调试信息显示区 -->
    <div id="debugBox" class="debug-box hidden"></div>
  </div>

  <!-- 主界面（初始隐藏） -->
  <div id="mainPanel" class="hidden">
    <div class="stats">
      <div class="stat-item" id="statCorrect">正确: 0</div>
      <div class="stat-item" id="statAccuracy">正确率: 0%</div>
      <div class="stat-item" id="statProgress">0/0</div>
      <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    </div>

    <div class="toolbar">
      <button id="seqBtn" class="active">顺序</button>
      <button id="randBtn">随机</button>
      <button id="wrongBtn">错题本</button>
      <select id="chapterSelect" style="padding:8px;border-radius:8px;border:1px solid #0052d9;"></select>
      <button id="exportWrongBtn">导出错题</button>
      <button id="clearRecordsBtn">清空记录</button>
      <button id="resetConfigBtn" style="background:#fdecec;border-color:#d54941;color:#d54941;">重设 Token</button>
    </div>

    <div class="card" id="questionCard">
      <div class="q-header">
        <span class="q-type" id="qType">单选题</span>
        <span id="qNumber">第 1 题</span>
      </div>
      <div class="q-title" id="qTitle"></div>
      <div id="optionsContainer"></div>
      <div id="resultBox" style="display:none; margin-top:16px; padding:12px; background:#f9fafb; border-radius:8px;"></div>
      <div class="btn-row">
        <button id="prevBtn" class="btn btn-secondary">← 上一题</button>
        <button id="submitBtn" class="btn btn-primary">提交答案</button>
        <button id="nextBtn" class="btn btn-primary" style="display:none;">下一题 →</button>
        <button id="toggleNotesBtn" class="btn btn-secondary">笔记</button>
      </div>
      <div id="notesPanel" class="notes-panel hidden">
        <b>历史笔记</b>
        <div id="notesList" style="margin:8px 0;"></div>
        <textarea id="noteInput" rows="2" placeholder="添加新笔记..." style="width:100%;padding:8px;border-radius:6px;"></textarea>
        <button id="addNoteBtn" class="btn btn-primary" style="margin-top:6px; padding:8px 16px;">添加笔记</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function $(id) { return document.getElementById(id); }

const GITHUB_API = 'https://api.github.com';
let ghOwner, ghRepo, ghToken;

function loadConfig() {
  ghOwner = $('ghOwner').value;
  ghRepo = $('ghRepo').value;
  ghToken = localStorage.getItem('quiz_gh_token') || '';
  $('ghToken').value = ghToken;
}
function saveConfig() {
  localStorage.setItem('quiz_gh_token', ghToken);
}

async function getFileContent(path) {
  const url = `${GITHUB_API}/repos/${ghOwner}/${ghRepo}/contents/${path}`;
  const res = await fetch(url, {
    headers: { 'Authorization': `token ${ghToken}`, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`获取文件失败: ${res.status}`);
  const data = await res.json();
  const content = atob(data.content.replace(/\n/g, ''));
  return { content, sha: data.sha };
}

async function putFile(path, content, sha, message = 'Update by quiz tool') {
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(content))),
    ...(sha ? { sha } : {})
  };
  const url = `${GITHUB_API}/repos/${ghOwner}/${ghRepo}/contents/${path}`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${ghToken}`,
      'Content-Type': 'application/json',
      'Accept': 'application/vnd.github.v3+json'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || '保存失败');
  }
  return res.json();
}

// ===================== 题库解析 =====================
class Question {
  constructor(originalIndex, chapter, title, options, answer, analysis) {
    this.originalIndex = originalIndex;
    this.chapter = chapter;
    this.title = title;
    this.options = options;
    this.answer = answer;
    this.isMulti = answer.length > 1;
    this.analysis = analysis;
    this.notes = [];
    this.wrongCorrectCount = 0;
  }
}

function parseQuestions(text) {
  // 去除 markdown 标记和多余格式
  text = text.replace(/```[a-z]*\n?/g, '')
        .replace(/#{1,6}\s*/g, '')
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = text.split('\n');
  const questions = [];
  let currentQ = null;
  let globalId = 0;
  let isReadingAnalysis = false;
  let currentChapter = '默认章节';
  const chapterSet = new Set(['全部题目', currentChapter]);

  for (let rawLine of lines) {
    let line = rawLine.trim();
    if (!line) continue;
    // 章节标题（如“操作系统 约20道”或“第一章 绪论”）
    if (line.match(/^.+?[（(]约\d+道[）)]$/) || line.match(/^第[一二三四五六七八九十\d]+章\s*.+$/)) {
      currentChapter = line.replace(/[（(]约\d+道[）)]/, '').trim();
      chapterSet.add(currentChapter);
      continue;
    }
    // 题号（如 1. 题目内容）
    if (line.match(/^\d+[.、．]\s*(.*)/)) {
      if (currentQ && currentQ.answer) questions.push(currentQ);
      const title = line.replace(/^\d+[.、．]\s*/, '');
      currentQ = new Question(globalId++, currentChapter, title, {}, '', '');
      isReadingAnalysis = false;
      continue;
    }
    if (!currentQ) continue;
    // 选项（A. xxx）
    if (line.match(/^[A-Ea-e][.、．\s]\s*(.*)/) && !isReadingAnalysis) {
      const key = line.charAt(0).toUpperCase();
      const val = line.substring(1).replace(/^[.、．\s]+/, '');
      currentQ.options[key] = val;
      continue;
    }
    // 答案行
    if (line.match(/^(正确答案|答案)[：:]\s*([A-Ea-e,\s]+)/)) {
      const ansStr = line.replace(/^(正确答案|答案)[：:]\s*/, '').replace(/[^A-Ea-e]/g, '').toUpperCase();
      currentQ.answer = ansStr.split('').sort().join('');
      currentQ.isMulti = currentQ.answer.length > 1;
      continue;
    }
    // 解析行
    if (line.match(/^解析[：:]\s*(.*)/)) {
      currentQ.analysis = line.replace(/^解析[：:]\s*/, '');
      isReadingAnalysis = true;
      continue;
    }
    if (isReadingAnalysis && currentQ) {
      currentQ.analysis += '\n' + line;
    }
  }
  if (currentQ && currentQ.answer) questions.push(currentQ);
  return { questions, chapters: [...chapterSet] };
}

// ===================== 应用状态 =====================
let allQuestions = [];
let allChapters = [];
let selectedChapter = '全部题目';
let currentQuestions = [];
let currentIndex = 0;
let mode = 'sequence';
let wrongSet = new Set();
let totalAnswered = 0, totalCorrect = 0;

const modeAnswers = {};
const modeSubmitted = {};
let wrongModeAnswers = {};
let wrongModeSubmitted = {};
const modeIndexMap = {};

let lastSyncTime = null;
let recordDirty = false;

function updateStats() {
  $('statCorrect').textContent = `正确: ${totalCorrect}`;
  const acc = totalAnswered ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
  $('statAccuracy').textContent = `正确率: ${acc}%`;
  $('statProgress').textContent = `${totalAnswered}/${allQuestions.length}`;
  const pct = currentQuestions.length ? ((currentIndex + 1) / currentQuestions.length) * 100 : 0;
  $('progressBar').style.width = pct + '%';
}

function refreshQuestionCard() {
  if (!currentQuestions.length) {
    $('qTitle').textContent = '当前章节/模式下暂无题目';
    $('optionsContainer').innerHTML = '';
    $('resultBox').style.display = 'none';
    $('submitBtn').style.display = 'inline-block';
    $('nextBtn').style.display = 'none';
    updateStats();
    return;
  }
  if (currentIndex < 0) currentIndex = 0;
  if (currentIndex >= currentQuestions.length) currentIndex = currentQuestions.length - 1;

  const q = currentQuestions[currentIndex];
  const effAnswer = getEffectiveAnswer(q);
  const effSubmitted = isEffectiveSubmitted(q);

  $('qType').textContent = q.isMulti ? '多选题' : '单选题';
  $('qType').style.background = q.isMulti ? '#fff7e6' : '#e8f3ff';
  $('qType').style.color = q.isMulti ? '#d46b08' : '#0052d9';
  $('qNumber').textContent = `第 ${currentIndex+1} 题 / 共 ${currentQuestions.length} 题 (全局:${q.originalIndex+1})`;
  $('qTitle').textContent = q.title;

  const container = $('optionsContainer');
  container.innerHTML = '';
  for (let key of Object.keys(q.options)) {
    const optDiv = document.createElement('div');
    optDiv.className = 'option';
    optDiv.dataset.key = key;
    optDiv.innerHTML = `<span class="option-key">${key}</span><span>${q.options[key]}</span>`;
    optDiv.onclick = () => selectOption(key, q.isMulti);
    container.appendChild(optDiv);
  }

  if (effSubmitted) {
    disableOptions();
    highlightCorrectAnswer(q, effAnswer);
    showResult(q, effAnswer);
    $('submitBtn').style.display = 'none';
    $('nextBtn').style.display = 'inline-block';
  } else {
    $('resultBox').style.display = 'none';
    $('submitBtn').style.display = 'inline-block';
    $('nextBtn').style.display = 'none';
    for (let opt of container.children) {
      if (effAnswer.includes(opt.dataset.key)) opt.classList.add('selected');
    }
  }

  if (!$('notesPanel').classList.contains('hidden')) renderNotes(q);
  updateStats();
}

function getEffectiveAnswer(q) {
  if (mode === 'wrong') return wrongModeAnswers[q.originalIndex] || '';
  return (modeAnswers[mode] && modeAnswers[mode][q.originalIndex]) || '';
}
function isEffectiveSubmitted(q) {
  if (mode === 'wrong') return !!wrongModeSubmitted[q.originalIndex];
  return !!(modeSubmitted[mode] && modeSubmitted[mode][q.originalIndex]);
}
function setEffectiveAnswer(q, ans) {
  if (mode === 'wrong') wrongModeAnswers[q.originalIndex] = ans;
  else {
    if (!modeAnswers[mode]) modeAnswers[mode] = {};
    modeAnswers[mode][q.originalIndex] = ans;
  }
}
function setEffectiveSubmitted(q, val) {
  if (mode === 'wrong') wrongModeSubmitted[q.originalIndex] = val;
  else {
    if (!modeSubmitted[mode]) modeSubmitted[mode] = {};
    modeSubmitted[mode][q.originalIndex] = val;
  }
}

function selectOption(key, isMulti) {
  const q = currentQuestions[currentIndex];
  if (isEffectiveSubmitted(q)) return;
  let effAnswer = getEffectiveAnswer(q);
  if (isMulti) {
    if (effAnswer.includes(key)) effAnswer = effAnswer.replace(key, '');
    else { effAnswer = (effAnswer + key).split('').sort().join(''); }
  } else {
    effAnswer = key;
    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  }
  setEffectiveAnswer(q, effAnswer);
  document.querySelectorAll('.option').forEach(o => {
    if (effAnswer.includes(o.dataset.key)) o.classList.add('selected');
    else if (!isMulti) o.classList.remove('selected');
  });
}

function submitAnswer() {
  const q = currentQuestions[currentIndex];
  const effAnswer = getEffectiveAnswer(q);
  if (!effAnswer) { showToast('请先选择答案'); return; }
  if (mode === 'wrong') {
    wrongModeSubmitted[q.originalIndex] = true;
    if (effAnswer === q.answer) {
      q.wrongCorrectCount++;
      if (q.wrongCorrectCount >= 10) {
        wrongSet.delete(q.originalIndex);
        applyFilter();
        if (!currentQuestions.length) {
          switchMode('sequence');
          return;
        }
      }
    }
  } else {
    setEffectiveSubmitted(q, true);
    totalAnswered++;
    if (effAnswer === q.answer) {
      totalCorrect++;
      wrongSet.delete(q.originalIndex);
    } else {
      wrongSet.add(q.originalIndex);
    }
  }
  disableOptions();
  highlightCorrectAnswer(q, effAnswer);
  showResult(q, effAnswer);
  $('submitBtn').style.display = 'none';
  $('nextBtn').style.display = 'inline-block';
  markDirty();
}

function disableOptions() {
  document.querySelectorAll('.option').forEach(o => { o.style.pointerEvents = 'none'; o.classList.remove('selected'); });
}
function highlightCorrectAnswer(q, userAnswer) {
  document.querySelectorAll('.option').forEach(o => {
    o.classList.remove('correct', 'wrong', 'selected');
    const key = o.dataset.key;
    if (q.answer.includes(key)) o.classList.add('correct');
    else if (userAnswer.includes(key)) o.classList.add('wrong');
  });
}
function showResult(q, userAnswer) {
  const correct = userAnswer === q.answer;
  const analysis = q.analysis || '暂无解析';
  $('resultBox').style.display = 'block';
  $('resultBox').innerHTML = `
    <div style="font-weight:bold;color:${correct?'#2ba471':'#d54941'}">${correct ? '✔ 回答正确！' : '✘ 回答错误，正确答案是：' + q.answer}</div>
    <div style="margin-top:8px; white-space:pre-wrap;">${analysis}</div>
  `;
}

function nextQuestion() {
  const q = currentQuestions[currentIndex];
  if (!isEffectiveSubmitted(q)) { showToast('请先提交当前题目'); return; }
  if (currentIndex < currentQuestions.length - 1) { currentIndex++; markDirty(); refreshQuestionCard(); }
  else showToast('已经是最后一题');
}
function prevQuestion() {
  const q = currentQuestions[currentIndex];
  if (!isEffectiveSubmitted(q)) { showToast('请先提交当前题目'); return; }
  if (currentIndex > 0) { currentIndex--; markDirty(); refreshQuestionCard(); }
  else showToast('已经是第一题');
}

function applyFilter() {
  let base = selectedChapter === '全部题目'
    ? [...allQuestions]
    : allQuestions.filter(q => q.chapter === selectedChapter);
  switch (mode) {
    case 'random':
      currentQuestions = base.sort(() => Math.random() - 0.5);
      break;
    case 'wrong':
      currentQuestions = base.filter(q => wrongSet.has(q.originalIndex));
      break;
    default:
      currentQuestions = base;
  }
  if (mode === 'wrong') {
    wrongModeAnswers = {};
    wrongModeSubmitted = {};
  }
}

function switchMode(newMode) {
  modeIndexMap[mode] = currentIndex;
  mode = newMode;
  applyFilter();
  currentIndex = modeIndexMap[mode] || 0;
  if (currentIndex >= currentQuestions.length) currentIndex = Math.max(0, currentQuestions.length-1);
  $('seqBtn').classList.toggle('active', mode==='sequence');
  $('randBtn').classList.toggle('active', mode==='random');
  $('wrongBtn').classList.toggle('active', mode==='wrong');
  markDirty();
  refreshQuestionCard();
}

$('seqBtn').onclick = () => switchMode('sequence');
$('randBtn').onclick = () => switchMode('random');
$('wrongBtn').onclick = () => switchMode('wrong');

$('chapterSelect').onchange = function() {
  selectedChapter = this.value;
  modeIndexMap[mode] = currentIndex;
  applyFilter();
  currentIndex = 0;
  markDirty();
  refreshQuestionCard();
};

$('submitBtn').onclick = submitAnswer;
$('nextBtn').onclick = nextQuestion;
$('prevBtn').onclick = prevQuestion;

$('toggleNotesBtn').onclick = function() {
  const panel = $('notesPanel');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) renderNotes(currentQuestions[currentIndex]);
};

$('addNoteBtn').onclick = function() {
  const note = $('noteInput').value.trim();
  if (!note) return;
  const q = currentQuestions[currentIndex];
  q.notes.push(note);
  $('noteInput').value = '';
  renderNotes(q);
  markDirty();
};

function renderNotes(q) {
  if (!q.notes.length) {
    $('notesList').innerHTML = '<div style="color:#999;">暂无笔记</div>';
  } else {
    $('notesList').innerHTML = q.notes.map((n,i) => `<div style="margin-bottom:6px;"><b>${i+1}.</b> ${n}</div>`).join('');
  }
}

$('clearRecordsBtn').onclick = function() {
  if (!confirm('确定清空当前模式的做题记录吗？')) return;
  if (mode === 'wrong') {
    wrongModeAnswers = {};
    wrongModeSubmitted = {};
  } else {
    delete modeAnswers[mode];
    delete modeSubmitted[mode];
  }
  markDirty();
  refreshQuestionCard();
  showToast('记录已清空');
};

$('exportWrongBtn').onclick = function() {
  if (!wrongSet.size) { showToast('暂无错题'); return; }
  let md = '# 错题本\n\n';
  let i = 1;
  for (let q of allQuestions) {
    if (wrongSet.has(q.originalIndex)) {
      md += `**${i++}. ${q.title}**\n\n`;
      for (let [k,v] of Object.entries(q.options)) md += `- **${k}**. ${v}\n`;
      md += `\n**正确答案**：${q.answer}\n\n**解析**：\n${q.analysis || '无'}\n\n---\n\n`;
    }
  }
  downloadFile('错题本.md', md);
  showToast('已导出错题本');
};

function downloadFile(filename, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: 'text/markdown'}));
  a.download = filename;
  a.click();
}

// ===================== 同步逻辑 =====================
function markDirty() {
  recordDirty = true;
}

async function syncRecords() {
  if (!recordDirty || !ghToken) return;
  try {
    const recordData = {
      modeAnswers, modeSubmitted, wrongModeAnswers, wrongModeSubmitted,
      wrongSet: [...wrongSet],
      totalAnswered, totalCorrect, mode, selectedChapter, currentIndex,
      lastSyncTime: new Date().toISOString(),
      notes: allQuestions.map(q => ({ idx: q.originalIndex, notes: q.notes })),
      wrongCorrectCounts: allQuestions.map(q => ({ idx: q.originalIndex, count: q.wrongCorrectCount }))
    };
    const content = JSON.stringify(recordData, null, 2);
    let sha = null;
    try {
      const existing = await getFileContent('record.json');
      if (existing) sha = existing.sha;
    } catch(e) {}
    await putFile('record.json', content, sha, `Sync records ${new Date().toLocaleString()}`);
    lastSyncTime = new Date();
    recordDirty = false;
    showToast('✔ 记录已同步到 GitHub');
  } catch (e) {
    console.error('同步失败:', e);
    showToast('⚠ 同步失败，稍后重试');
  }
}

setInterval(() => { if (recordDirty) syncRecords(); }, 10 * 60 * 1000);

// ===================== 连接与加载（带调试） =====================
async function connectAndLoad() {
  ghOwner = $('ghOwner').value;
  ghRepo = $('ghRepo').value;
  ghToken = $('ghToken').value.trim();
  if (!ghToken) { showToast('请输入 Token'); return; }
  saveConfig();
  const debugBox = $('debugBox');
  debugBox.classList.add('hidden');
  try {
    // 获取题库文件
    let quizText = '';
    try {
      const res = await getFileContent('quiz_text.md');
      if (res) quizText = res.content;
    } catch (e) {
      debugBox.textContent = '读取题库文件时出错：' + e.message;
      debugBox.classList.remove('hidden');
      return;
    }

    if (!quizText || quizText.trim() === '') {
      debugBox.textContent = '读取到的题库内容为空。请检查仓库中的 quiz_text.md 是否有内容。';
      debugBox.classList.remove('hidden');
      return;
    }

    // 解析题库
    const parsed = parseQuestions(quizText);
    if (!parsed.questions.length) {
      // 显示调试信息：原始内容的前500字符
      const preview = quizText.length > 500 ? quizText.substring(0, 500) + '...' : quizText;
      debugBox.innerHTML = `<strong>⚠ 未解析到题目，请检查题库格式。</strong><br><br>
        <strong>读取到的内容开头：</strong><br><pre>${escapeHtml(preview)}</pre>
        <br>可能原因：缺少章节标题、题号格式不符、答案行未识别。<br>
        标准格式示例见下文。`;
      debugBox.classList.remove('hidden');
      return;
    }

    // 加载记录
    allQuestions = parsed.questions;
    allChapters = parsed.chapters;

    try {
      const rec = await getFileContent('record.json');
      if (rec) {
        const data = JSON.parse(rec.content);
        Object.assign(modeAnswers, data.modeAnswers || {});
        Object.assign(modeSubmitted, data.modeSubmitted || {});
        wrongModeAnswers = data.wrongModeAnswers || {};
        wrongModeSubmitted = data.wrongModeSubmitted || {};
        wrongSet = new Set(data.wrongSet || []);
        totalAnswered = data.totalAnswered || 0;
        totalCorrect = data.totalCorrect || 0;
        mode = data.mode || 'sequence';
        selectedChapter = data.selectedChapter || '全部题目';
        currentIndex = data.currentIndex || 0;
        lastSyncTime = data.lastSyncTime ? new Date(data.lastSyncTime) : null;
        if (data.notes) {
          data.notes.forEach(({idx, notes}) => {
            const q = allQuestions.find(q => q.originalIndex === idx);
            if (q) q.notes = notes;
          });
        }
        if (data.wrongCorrectCounts) {
          data.wrongCorrectCounts.forEach(({idx, count}) => {
            const q = allQuestions.find(q => q.originalIndex === idx);
            if (q) q.wrongCorrectCount = count;
          });
        }
      }
    } catch(e) { console.warn('加载记录失败', e); }

    $('chapterSelect').innerHTML = allChapters.map(c => `<option ${c===selectedChapter?'selected':''}>${c}</option>`).join('');
    applyFilter();
    if (currentIndex >= currentQuestions.length) currentIndex = 0;
    $('seqBtn').classList.toggle('active', mode==='sequence');
    $('randBtn').classList.toggle('active', mode==='random');
    $('wrongBtn').classList.toggle('active', mode==='wrong');

    $('configPanel').classList.add('hidden');
    $('mainPanel').classList.remove('hidden');
    refreshQuestionCard();
    showToast(`加载成功，共 ${allQuestions.length} 题`);
  } catch(e) {
    debugBox.textContent = '连接失败: ' + e.message;
    debugBox.classList.remove('hidden');
  }
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

$('connectBtn').onclick = connectAndLoad;

$('resetConfigBtn').onclick = function() {
  if (confirm('确定清除保存的 Token 吗？这将需要重新输入。')) {
    localStorage.removeItem('quiz_gh_token');
    location.reload();
  }
};

loadConfig();
if (ghToken) {
  connectAndLoad().catch(() => {
    $('configPanel').classList.remove('hidden');
  });
} else {
