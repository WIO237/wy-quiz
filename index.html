<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>全能刷题工具</title>
  <meta http-equiv="Content-Security-Policy" content="img-src * data:; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline';">
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuWFqOiDveWIu+mimOW3pei3nyIsCiAgInNob3J0X25hbWUiOiAi5Yi75a6Y5bel5YW3IiwKICAic3RhcnRfdXJsIjogIi4vaW5kZXguaHRtbCIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2Y1ZjdmYSIsCiAgInRoZW1lX2NvbG9yIjogIiMwMDUyZDkiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJkYXRhOmltYWdlL3N2Zyt4bWw7YmFzZTY0LFBITjJaeUI0Yld4dWN6MGlhSFIwY0RvdkwzZDNkeTUzTXk1M2FIQXZaeTlpZVQwbmRISmhNUzEzWkc5dVNtOTBhR1Z5U1QwbmRHOXdZV3d1WkdWbVpYSmhkR2x1Wnk4aVBnbzhjM0JoWTJsdVp6NDhMM056WVdOcGJtYytQQzl6ZG1jKyIKICAgIH0KICBdCn0=">
  <meta name="theme-color" content="#0052d9">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f7fa; display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-size: 15px; padding-bottom: calc(env(safe-area-inset-bottom, 10px) + 15px); }
    #importPage, #quizPage { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 12px; }
    .hidden { display: none !important; }
    .token-row { display: flex; gap: 5px; margin: 10px 0; }
    .token-row input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
    .btn-full { display: block; width: 100%; background: #0052d9; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 18px; cursor: pointer; margin: 5px 0; text-align: center; }
    .btn-outline { display: block; width: 100%; background: white; color: #0052d9; border: 2px solid #0052d9; padding: 14px; border-radius: 10px; font-size: 18px; cursor: pointer; margin: 5px 0; }
    .stats-row { display: flex; align-items: center; background: white; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; }
    .progress-bar { flex: 1; height: 8px; background: #e0e0e0; border-radius: 4px; margin-right: 8px; overflow: hidden; }
    .progress-fill { height: 100%; background: #0052d9; width: 0%; }
    .stat-item { font-size: 13px; margin: 0 3px; white-space: nowrap; }
    .mode-row { display: flex; flex-wrap: wrap; align-items: center; background: white; padding: 6px; border-radius: 10px; margin-bottom: 8px; }
    .mode-btn { padding: 5px 10px; margin: 2px; border: 1px solid #0052d9; background: white; color: #0052d9; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .mode-btn.active { background: #0052d9; color: white; }
    .action-btn { padding: 5px 10px; margin: 2px; border: 1px solid #ccc; background: white; border-radius: 20px; font-size: 12px; cursor: pointer; }
    .danger-btn { color: #d54941; border-color: #d54941; }
    .sync-time { font-size: 11px; color: #666; margin-left: 4px; white-space: nowrap; }
    .jump-row { display: flex; align-items: center; background: white; padding: 6px; border-radius: 10px; margin-bottom: 8px; flex-wrap: wrap; gap: 4px; }
    .jump-row select, .jump-row input { padding: 6px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
    .jump-row button { padding: 6px 12px; background: #0052d9; color: white; border: none; border-radius: 6px; font-size: 14px; }
    .thumbnails { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; flex: 1; overflow-x: auto; }
    .thumb-cell { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; background: #eee; }
    .thumb-cell.current { border: 2px solid #0052d9; }
    .thumb-cell.correct { background: #b7eb8f; }
    .thumb-cell.wrong { background: #ffa39e; }
    .question-card { background: white; padding: 15px; border-radius: 12px; flex: 1; overflow-y: auto; margin-bottom: 12px; }
    .option-row { display: flex; align-items: center; padding: 10px; margin: 4px 0; border: 1px solid #e5e6eb; border-radius: 8px; cursor: pointer; }
    .option-key { width: 24px; height: 24px; background: #f5f7fa; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 8px; font-size: 14px; }
    .option-selected { border-color: #0052d9; background: #e8f3ff; } .option-selected .option-key { background: #0052d9; color: white; }
    .option-correct { border-color: #2ba471; background: #e8f8f0; } .option-correct .option-key { background: #2ba471; color: white; }
    .option-wrong { border-color: #d54941; background: #fdecec; } .option-wrong .option-key { background: #d54941; color: white; }
    .result-box { margin-top: 12px; padding: 10px; background: #fafafa; border-radius: 8px; word-wrap: break-word; }
    .result-box img { max-width: 100%; height: auto; border: none; }
    .bottom-bar { display: flex; justify-content: center; gap: 10px; padding: 12px 0; position: sticky; bottom: 0; background: #f5f7fa; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 10; }
    .note-panel { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; margin: 8px 0; }
    textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
    #loadingStatus { text-align: center; color: #666; margin: 20px 0; }

    /* 统计面板样式 */
    #statsOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 100;
      display: flex; justify-content: center; align-items: center;
    }
    #statsPanel {
      background: white; width: 90%; max-height: 80%; overflow-y: auto;
      border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    #statsPanel h3 { margin-bottom: 15px; text-align: center; color: #0052d9; }
    #statsContent { font-size: 14px; line-height: 1.6; }
    #statsContent ul { list-style: none; padding: 0; }
    #statsContent li {
      display: flex; justify-content: space-between; padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    #statsContent li:last-child { border-bottom: none; }
    #closeStatsBtn {
      display: block; margin: 15px auto 0; padding: 8px 20px;
      background: #0052d9; color: white; border: none; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="importPage">
    <h2 style="text-align:center; color:#0052d9;">全能刷题工具</h2>
    <div class="token-row">
      <input type="text" id="tokenInput" placeholder="输入 GitHub Token (需要 repo 权限)">
      <button id="saveTokenBtn" class="action-btn">保存</button>
    </div>
    <div id="loadingStatus">正在准备题库...</div>
    <button class="btn-full" id="startBtn">▶ 开始刷题</button>
    <p style="text-align:center;color:#999;font-size:12px;">底部已完美适配，不再遮挡</p>
  </div>

  <div id="quizPage" class="hidden">
    <div class="stats-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="stat-item" id="correctStat">正确:0</span>
      <span class="stat-item" id="accuracyStat">正确率:0%</span>
      <span class="stat-item" id="progressStat">0/0</span>
    </div>
    <div class="mode-row">
      <button class="mode-btn active" data-mode="sequence">顺序</button>
      <button class="mode-btn" data-mode="random">随机</button>
      <button class="mode-btn" data-mode="wrong">错题本</button>
      <button class="action-btn" id="exportWrongBtn">导出错题</button>
      <button class="action-btn" id="saveQuizBtn">💾 保存题库至GitHub</button>
      <button class="action-btn" id="syncBtn">🔄 立即同步</button>
      <span class="sync-time" id="syncTime">未同步</span>
      <button class="action-btn" id="clearRecordBtn">清空记录</button>
      <button class="action-btn danger-btn" id="clearCacheBtn">清除缓存</button>
      <button class="action-btn" id="statsBtn">📊 错题统计</button>
    </div>
    <div class="jump-row">
      <select id="chapterSelect" style="width:100px;"></select>
      <input type="number" id="jumpInput" placeholder="题号" style="width:55px;">
      <button id="goBtn">Go</button>
      <div class="thumbnails" id="thumbContainer"></div>
      <button id="prevGroupBtn" class="action-btn">◀</button>
      <button id="nextGroupBtn" class="action-btn">▶</button>
    </div>
    <div class="question-card" id="questionCard">
      <div id="qType" style="display:inline-block; padding:4px 10px; border-radius:4px; font-weight:bold; margin-bottom:8px;">单选题</div>
      <div id="qNumber" style="margin-bottom:8px;">第1题</div>
      <div id="qTitle" style="font-size:17px; margin-bottom:12px;"></div>
      <div id="optionsContainer"></div>
      <div id="resultContainer" class="result-box hidden"></div>
    </div>
    <div id="notePanel" class="note-panel hidden">
      <div id="noteContent" style="max-height:100px; overflow-y:auto; margin-bottom:6px;"></div>
      <div style="display:flex; gap:5px; margin-bottom:6px;">
        <textarea id="noteInput" placeholder="输入新解析内容..." rows="2" style="flex:1;"></textarea>
        <button class="action-btn" id="uploadImageBtn" style="white-space:nowrap;">🖼️ 上传图片</button>
      </div>
      <button class="btn-full" id="addAnalysisBtn" style="margin-top:6px; padding:10px;">添加解析</button>
    </div>
    <div class="bottom-bar">
      <button class="action-btn" id="prevBtn">← 上一题</button>
      <button class="btn-full" id="submitBtn" style="flex:1;">提交答案</button>
      <button class="btn-full" id="nextBtn" style="flex:1; display:none;">下一题 →</button>
      <button class="action-btn" id="toggleNoteBtn">笔记</button>
    </div>
  </div>

  <!-- 统计遮罩 -->
  <div id="statsOverlay" class="hidden">
    <div id="statsPanel">
      <h3>📊 章节错题统计</h3>
      <div id="statsContent"></div>
      <button id="closeStatsBtn">关闭</button>
    </div>
  </div>

  <script>
    // ★★★ 配置区 ★★★
    const QUIZ_MD_URL   = 'https://raw.githubusercontent.com/WIO237/wy-quiz/main/quiz.md';
    const GITHUB_RAW_BASE = 'https://cdn.jsdelivr.net/gh/WIO237/wy-quiz@main/';
    const GITHUB_REPO_OWNER = 'WIO237';
    const GITHUB_REPO_NAME  = 'wy-quiz';
    const QUIZ_FILE_PATH    = 'quiz.md';
    const PROGRESS_FILE_PATH = 'progress.json';
    const IMAGE_FOLDER = '2026一级建造师习题班汇总.assets';
    // ★★★ 配置结束 ★★★

    // 全局状态
    let allQuestions = [];
    let currentMode = 'sequence';
    let wrongSet = new Set();
    let modeAnswers = {};
    let modeSubmitted = {};
    let wrongAnswers = {};
    let wrongSubmitted = {};
    let currentIndex = 0;
    let totalAnswered = 0, totalCorrect = 0;
    let chapters = ['全部题目'];
    let selectedChapter = '全部题目';
    let thumbPage = 0;
    let thumbItemsPerPage = 20;
    let notes = {};
    let githubToken = localStorage.getItem('githubToken') || '';
    let lastSyncTime = null;
    let autoSyncTimer = null;

    function shuffle(arr) { for (let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} }

    function convertImagesToHtml(text) {
      if (!text) return '';
      let fixed = text.replace(/https:\/\/raw\.githubusercontent\.com\/WIO237\/wy-quiz\/main\//g, GITHUB_RAW_BASE);
      return fixed.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, path) => {
        let src = path;
        if (/^https?:\/\//i.test(path) || /^data:/i.test(path)) {
        } else {
          const name = path.split(/[/\\]/).pop();
          src = GITHUB_RAW_BASE + IMAGE_FOLDER + '/' + encodeURIComponent(name);
        }
        return `<img src="${src}" alt="${alt}" style="max-width:100%;height:auto;" referrerpolicy="no-referrer">`;
      });
    }

    function parseQuestions(text) {
      text = convertImagesToHtml(text).replace(/```[a-z]*\n?/g,'').replace(/#{1,6}\s*/g,'').replace(/\*\*(.*?)\*\*/g,'$1').replace(/\*(.*?)\*/g,'$1').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
      const lines = text.split('\n');
      const questions = [];
      let cur = null, id=0, analysis=false, chapter='默认章节';
      for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        if (/^.+?[（(]约\d+道[）)]$/.test(line)||/^第[一二三四五六七八九十\d]+章\s*.+$/.test(line)) { chapter=line.replace(/[（(]约\d+道[）)]/,'').trim(); continue; }
        if (/^\d+[.、．]\s*(.*)/.test(line)) { if (cur&&cur.answer) questions.push(cur); cur={originalIndex:id++,chapter,title:line.replace(/^\d+[.、．]\s*/,''),options:{},answer:'',isMulti:false,analysis:''}; analysis=false; continue; }
        if (!cur) continue;
        if (/^[A-Ea-e][.、．\s]\s*(.*)/.test(line)&&!analysis) { const k=line[0].toUpperCase(); cur.options[k]=line.substring(1).replace(/^[.、．\s]+/,''); continue; }
        if (/^(正确答案|答案)[：:]\s*([A-Ea-e,\s]+)/.test(line)) { const a=line.replace(/^(正确答案|答案)[：:]\s*/,'').replace(/[^A-Ea-e]/g,'').toUpperCase(); cur.answer=[...a].sort().join(''); cur.isMulti=cur.answer.length>1; continue; }
        if (/^解析[：:]\s*(.*)/.test(line)) { cur.analysis=line.replace(/^解析[：:]\s*/,''); analysis=true; continue; }
        if (analysis) cur.analysis+='\n'+line;
      }
      if (cur&&cur.answer) questions.push(cur);
      return questions;
    }

    function generateFullQuizText() {
      let md = '# 题库\n\n';
      const chs = [...new Set(allQuestions.map(q => q.chapter))];
      chs.forEach(ch => {
        md += `## ${ch}\n\n`;
        allQuestions.filter(q => q.chapter === ch).forEach(q => {
          md += `${q.originalIndex+1}. ${q.title}\n\n`;
          for (const [k, v] of Object.entries(q.options)) md += `${k}. ${v}\n`;
          md += `\n答案：${q.answer}\n\n`;
          if (q.analysis) md += `解析：\n${q.analysis}\n\n`;
          md += '\n';
        });
      });
      return md;
    }

    function saveState() {
      const state = { modeAnswers, modeSubmitted, wrongAnswers, wrongSubmitted, wrongSet:Array.from(wrongSet), totalAnswered, totalCorrect, notes, currentMode, selectedChapter, currentIndex };
      localStorage.setItem('quizState', JSON.stringify(state));
    }

    function mergeProgress(remote) {
      for (const m of ['sequence', 'random']) {
        if (!modeSubmitted[m]) modeSubmitted[m] = {};
        if (!modeAnswers[m]) modeAnswers[m] = {};
        const rSub = (remote.modeSubmitted && remote.modeSubmitted[m]) || {};
        const rAns = (remote.modeAnswers && remote.modeAnswers[m]) || {};
        for (const idx in rSub) {
          if (!modeSubmitted[m][idx]) {
            modeSubmitted[m][idx] = rSub[idx];
            modeAnswers[m][idx] = rAns[idx] || '';
          }
        }
      }
      wrongAnswers = { ...remote.wrongAnswers, ...wrongAnswers };
      wrongSubmitted = { ...remote.wrongSubmitted, ...wrongSubmitted };
      wrongSet = new Set([...wrongSet, ...(Array.isArray(remote.wrongSet) ? remote.wrongSet : [])]);
      notes = { ...remote.notes, ...notes };
      let calcTotal = 0, calcCorrect = 0;
      for (const m of ['sequence', 'random']) {
        const subMap = modeSubmitted[m] || {};
        const ansMap = modeAnswers[m] || {};
        for (const idx in subMap) {
          if (subMap[idx]) {
            calcTotal++;
            const q = allQuestions.find(q => q.originalIndex == idx);
            if (q && ansMap[idx] === q.answer) calcCorrect++;
          }
        }
      }
      totalAnswered = calcTotal;
      totalCorrect = calcCorrect;
    }

    async function syncProgressToRepo(silent=false, skipMerge=false) {
      if (!githubToken) return;
      const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${PROGRESS_FILE_PATH}`;
      const headers = { 'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json' };
      try {
        let sha = null;
        if (!skipMerge) {
          try {
            const res = await fetch(apiUrl, { headers });
            if (res.ok) { const fi = await res.json(); sha = fi.sha; mergeProgress(JSON.parse(atob(fi.content))); }
          } catch(e) {}
        } else {
          try { const res = await fetch(apiUrl, { headers }); if (res.ok) sha = (await res.json()).sha; } catch(e) {}
        }
        const dataToSave = { modeAnswers, modeSubmitted, wrongAnswers, wrongSubmitted, wrongSet:Array.from(wrongSet), totalAnswered, totalCorrect, notes, currentMode, selectedChapter, currentIndex };
        const body = { message: 'Update progress', content: btoa(unescape(encodeURIComponent(JSON.stringify(dataToSave, null, 2)))) };
        if (sha) body.sha = sha;
        const putRes = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
        if (!putRes.ok) throw new Error('上传失败');
        lastSyncTime = new Date(); updateSyncTimeDisplay();
        return true;
      } catch (e) {
        if (!silent) alert('同步失败: ' + e.message);
        else console.log('自动同步失败: ' + e.message);
        return false;
      }
    }

    async function loadProgressFromRepo(retries = 3) {
      if (!githubToken) throw new Error('未设置Token');
      const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${PROGRESS_FILE_PATH}`;
      for (let i=0; i<retries; i++) {
        try {
          const res = await fetch(apiUrl, { headers: { 'Authorization': `token ${githubToken}` } });
          if (res.ok) {
            const data = JSON.parse(atob((await res.json()).content));
            modeAnswers = data.modeAnswers || {}; modeSubmitted = data.modeSubmitted || {};
            wrongAnswers = data.wrongAnswers || {}; wrongSubmitted = data.wrongSubmitted || {};
            wrongSet = new Set(data.wrongSet || []); totalAnswered = data.totalAnswered || 0; totalCorrect = data.totalCorrect || 0;
            notes = data.notes || {}; currentMode = data.currentMode || 'sequence';
            selectedChapter = chapters.includes(data.selectedChapter) ? data.selectedChapter : '全部题目';
            currentIndex = data.currentIndex || 0;
            saveState();
            return true;
          }
          if (res.status === 404) {
            modeAnswers = {}; modeSubmitted = {}; wrongAnswers = {}; wrongSubmitted = {};
            wrongSet = new Set(); totalAnswered = 0; totalCorrect = 0; notes = {};
            currentMode = 'sequence'; selectedChapter = '全部题目'; currentIndex = 0;
            saveState();
            return true;
          }
        } catch(e) {}
        if (i < retries-1) await new Promise(r => setTimeout(r, 1000));
      }
      throw new Error('无法连接到 GitHub，请检查网络');
    }

    function updateSyncTimeDisplay() {
      const el = document.getElementById('syncTime');
      if (!lastSyncTime) el.textContent = '未同步';
      else { const t=lastSyncTime; el.textContent=`上次同步：${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`; }
    }

    function startAutoSync() {
      if (autoSyncTimer) clearInterval(autoSyncTimer);
      if (!githubToken) return;
      syncProgressToRepo(true);
      autoSyncTimer = setInterval(() => syncProgressToRepo(true), 10*60*1000);
    }

    async function uploadImageToRepo(base64Data) {
      if (!base64Data.startsWith('data:image')) return null;
      const [header, data] = base64Data.split(',');
      const mime = header.match(/image\/(\w+);?/)?.[1] || 'png';
      const ext = mime === 'jpeg' ? 'jpg' : mime;
      const filename = `img_${Date.now()}_${Math.random().toString(36).substring(2,8)}.${ext}`;
      const path = `${IMAGE_FOLDER}/${filename}`;
      const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${path}`;
      const headers = { 'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json' };
      const res = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify({ message: `Upload ${filename}`, content: data }) });
      if (!res.ok) throw new Error('上传图片失败');
      return `${GITHUB_RAW_BASE}${IMAGE_FOLDER}/${encodeURIComponent(filename)}`;
    }

    async function uploadAllBase64Images() {
      const regex = /data:image\/[^;]+;base64,[A-Za-z0-9+/=]+/g;
      const tasks = [];
      for (let q of allQuestions) {
        if (!q.analysis) continue;
        const matches = q.analysis.match(regex);
        if (!matches) continue;
        for (let b64 of matches) {
          tasks.push((async () => {
            const url = await uploadImageToRepo(b64);
            if (url) q.analysis = q.analysis.replace(b64, url);
          })());
        }
      }
      await Promise.all(tasks);
    }

    async function saveQuizToGitHub(silent=false) {
      if (!githubToken) return;
      try { await uploadAllBase64Images(); } catch(e) { if (!silent) alert('图片上传失败: ' + e.message); return; }
      const newContent = generateFullQuizText();
      const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${QUIZ_FILE_PATH}`;
      try {
        const getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${githubToken}` } });
        if (!getRes.ok) throw new Error('无法获取文件信息');
        const sha = (await getRes.json()).sha;
        const putBody = { message: 'Update quiz', content: btoa(unescape(encodeURIComponent(newContent))), sha };
        const putRes = await fetch(apiUrl, { method: 'PUT', headers: { 'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify(putBody) });
        if (!putRes.ok) throw new Error('更新失败');
        localStorage.setItem('quizText', newContent);
        lastSyncTime = new Date(); updateSyncTimeDisplay();
        if (!silent) alert('题库已保存至 GitHub 仓库！');
      } catch (e) { if (!silent) alert('保存失败：' + e.message); }
    }

    async function loadQuizText() {
      if (githubToken) {
        document.getElementById('loadingStatus').innerText = '正在从 GitHub 下载最新题库...';
        try {
          const res = await fetch(QUIZ_MD_URL);
          if (res.ok) {
            const text = await res.text();
            localStorage.setItem('quizText', text);
            return text;
          }
        } catch(e) {}
      }
      const cached = localStorage.getItem('quizText');
      if (cached) {
        document.getElementById('loadingStatus').innerText = '正在恢复本地题库...';
        return cached;
      }
      document.getElementById('loadingStatus').innerText = '正在从 GitHub 下载题库...';
      try {
        const res = await fetch(QUIZ_MD_URL);
        if (!res.ok) throw new Error(`下载失败 (${res.status})`);
        const text = await res.text();
        localStorage.setItem('quizText', text);
        return text;
      } catch(e) { alert('无法下载题库，请检查题库 URL 或网络连接。'); throw e; }
    }

    function getCurrentQuestions() {
      let base = selectedChapter==='全部题目'?[...allQuestions]:allQuestions.filter(q=>q.chapter===selectedChapter);
      if (currentMode==='random') shuffle(base);
      else if (currentMode==='wrong') { base = base.filter(q=>wrongSet.has(q.originalIndex)); shuffle(base); }
      return base;
    }
    function getEffectiveAnswer(q) { return currentMode==='wrong'?wrongAnswers[q.originalIndex]||'':(modeAnswers[currentMode]||{})[q.originalIndex]||''; }
    function isSubmitted(q) { return currentMode==='wrong'?!!wrongSubmitted[q.originalIndex]:!!((modeSubmitted[currentMode]||{})[q.originalIndex]); }
    function setAnswer(q,ans) { if(currentMode==='wrong') wrongAnswers[q.originalIndex]=ans; else { if(!modeAnswers[currentMode]) modeAnswers[currentMode]={}; modeAnswers[currentMode][q.originalIndex]=ans; } }
    function setSubmitted(q,v=true) { if(currentMode==='wrong') wrongSubmitted[q.originalIndex]=v; else { if(!modeSubmitted[currentMode]) modeSubmitted[currentMode]={}; modeSubmitted[currentMode][q.originalIndex]=v; } }

    function renderQuestion() {
      const questions = getCurrentQuestions();
      if (!questions.length) {
        document.getElementById('qTitle').innerText='暂无题目';
        document.getElementById('optionsContainer').innerHTML='';
        document.getElementById('resultContainer').classList.add('hidden');
        document.getElementById('submitBtn').style.display='inline-block';
        document.getElementById('nextBtn').style.display='none';
        updateStats(questions); renderThumbnails(questions); return;
      }
      if (currentIndex>=questions.length) currentIndex=questions.length-1;
      if (currentIndex<0) currentIndex=0;
      const q = questions[currentIndex];
      document.getElementById('qTitle').innerHTML = convertImagesToHtml(q.title);
      document.getElementById('qType').innerText = q.isMulti?'多选题':'单选题';
      document.getElementById('qType').style.background = q.isMulti?'#fff7e6':'#e8f3ff';
      document.getElementById('qNumber').innerText = `第 ${currentIndex+1} 题 / 共 ${questions.length} 题 (全局:${q.originalIndex+1})`;
      const optsDiv = document.getElementById('optionsContainer');
      optsDiv.innerHTML = '';
      const effAns = getEffectiveAnswer(q);
      const sub = isSubmitted(q);
      for (const [k,v] of Object.entries(q.options)) {
        const row = document.createElement('div');
        row.className = 'option-row';
        if (sub) { if (q.answer.includes(k)) row.classList.add('option-correct'); else if (effAns.includes(k)) row.classList.add('option-wrong'); }
        else if (effAns.includes(k)) row.classList.add('option-selected');
        row.innerHTML = `<span class="option-key">${k}</span><span>${v}</span>`;
        row.addEventListener('click', ()=>selectOption(q,k));
        optsDiv.appendChild(row);
      }
      document.getElementById('resultContainer').classList.add('hidden');
      if (sub) {
        document.getElementById('submitBtn').style.display='none';
        document.getElementById('nextBtn').style.display='inline-block';
        showResult(q,effAns);
      } else {
        document.getElementById('submitBtn').style.display='inline-block';
        document.getElementById('nextBtn').style.display='none';
      }
      updateStats(questions); renderThumbnails(questions);
    }

    function selectOption(q,key) { if(isSubmitted(q))return; let ans=getEffectiveAnswer(q); if(q.isMulti) ans=ans.includes(key)?ans.replace(key,''):(ans+key).split('').sort().join(''); else ans=key; setAnswer(q,ans); renderQuestion(); }
    function showResult(q,effAns) {
      const correct = effAns===q.answer;
      const div = document.getElementById('resultContainer');
      div.classList.remove('hidden');
      const analysisHtml = convertImagesToHtml(q.analysis || '无');
      div.innerHTML = `<div style="font-weight:bold;color:${correct?'#2ba471':'#d54941'}">${correct ? '✔ 回答正确！' : '✘ 回答错误！正确答案：' + q.answer}</div><div style="font-weight:bold;margin-top:10px;">解析：</div><div style="white-space:pre-wrap;">${analysisHtml}</div>`;
    }

    async function submitAnswer() {
      const questions = getCurrentQuestions(); if(!questions.length)return;
      const q = questions[currentIndex]; const ans = getEffectiveAnswer(q); if(!ans)return alert('请先选择答案');
      if(currentMode==='wrong') { wrongSubmitted[q.originalIndex]=true; if(ans===q.answer){ q.wrongCorrectCount=(q.wrongCorrectCount||0)+1; if(q.wrongCorrectCount>=10) wrongSet.delete(q.originalIndex); } }
      else { setSubmitted(q); totalAnswered++; if(ans===q.answer){ totalCorrect++; wrongSet.delete(q.originalIndex); } else wrongSet.add(q.originalIndex); }
      saveState();
      renderQuestion();
      syncProgressToRepo(true);
    }

    function nextQuestion() {
      const questions = getCurrentQuestions(); if(!isSubmitted(questions[currentIndex]))return alert('请先提交当前题目');
      if(currentIndex<questions.length-1) currentIndex++; else return alert('已经是最后一题');
      saveState(); renderQuestion();
    }
    function prevQuestion() {
      const questions = getCurrentQuestions(); if(!isSubmitted(questions[currentIndex]))return alert('请先提交当前题目');
      if(currentIndex>0) currentIndex--; else return alert('已经是第一题');
      saveState(); renderQuestion();
    }

    function switchMode(mode) { if(currentMode!==mode){ currentMode=mode; currentIndex=0; thumbPage=0; saveState(); updateModeButtons(); renderQuestion(); } }
    function updateModeButtons() { document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===currentMode)); }

    // 新增：显示章节错题统计
    function showStats() {
      const chapterStats = {};
      // 初始化所有章节（从题目中动态获取）
      const allChapters = new Set(allQuestions.map(q => q.chapter));
      allChapters.forEach(ch => {
        chapterStats[ch] = { total: 0, wrong: 0 };
      });
      allQuestions.forEach(q => {
        const ch = q.chapter;
        chapterStats[ch].total++;
        if (wrongSet.has(q.originalIndex)) {
          chapterStats[ch].wrong++;
        }
      });
      // 生成 HTML
      let html = '<ul>';
      for (const [ch, data] of Object.entries(chapterStats)) {
        const rate = data.total > 0 ? ((data.wrong / data.total) * 100).toFixed(1) : '0.0';
        html += `<li><span>${ch}</span><span>${data.wrong}/${data.total} (${rate}%)</span></li>`;
      }
      html += '</ul>';
      document.getElementById('statsContent').innerHTML = html;
      document.getElementById('statsOverlay').classList.remove('hidden');
    }

    function closeStats() {
      document.getElementById('statsOverlay').classList.add('hidden');
    }

    async function clearCurrentModeRecords() {
      if(currentMode==='wrong'){ wrongAnswers = {}; wrongSubmitted = {}; }
      else {
        const sub = modeSubmitted[currentMode];
        if(sub){
          let cl=0, cc=0;
          const ans = modeAnswers[currentMode]||{};
          for(const idx in sub){
            if(sub[idx]){
              cl++;
              const q = allQuestions.find(q=>q.originalIndex==idx);
              if(q && ans[idx]===q.answer) cc++;
            }
          }
          totalAnswered -= cl; totalCorrect -= cc;
          delete modeAnswers[currentMode];
          delete modeSubmitted[currentMode];
        }
      }
      saveState();
      renderQuestion();
      const success = await syncProgressToRepo(true, true);
      if (success) {
        alert('当前模式做题记录已清空，并已同步到云端');
      } else {
        alert('云端清空失败，请检查网络后重试！');
      }
    }

    function renderThumbnails(questions) {
      const container=document.getElementById('thumbContainer'); container.innerHTML=''; if(!questions.length)return;
      const cw=container.clientWidth||300; thumbItemsPerPage=Math.max(1,Math.floor((cw+3)/33));
      const totalPages=Math.ceil(questions.length/thumbItemsPerPage); if(thumbPage>=totalPages) thumbPage=totalPages-1; if(thumbPage<0) thumbPage=0;
      const start=thumbPage*thumbItemsPerPage, end=Math.min(start+thumbItemsPerPage,questions.length);
      for(let i=start;i<end;i++) {
        const q=questions[i]; const cell=document.createElement('div'); cell.className='thumb-cell'; cell.innerText=i+1;
        if(i===currentIndex) cell.classList.add('current');
        const sub=isSubmitted(q); if(sub){ const ans=getEffectiveAnswer(q); cell.classList.add(ans===q.answer?'correct':'wrong'); }
        cell.addEventListener('click',()=>{ currentIndex=i; saveState(); renderQuestion(); });
        container.appendChild(cell);
      }
    }

    function downloadFile(filename,text) { const blob=new Blob([text],{type:'text/markdown'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); URL.revokeObjectURL(a.href); }
    function updateStats(questions) {
      document.getElementById('correctStat').innerText=`正确:${totalCorrect}`;
      const acc=totalAnswered>0?(totalCorrect/totalAnswered*100).toFixed(0):0;
      document.getElementById('accuracyStat').innerText=`正确率:${acc}%`;
      document.getElementById('progressStat').innerText=`${totalAnswered}/${allQuestions.length}`;
      document.getElementById('progressFill').style.width=`${questions.length?(currentIndex+1)/questions.length*100:0}%`;
    }

    // 上传图片按钮
    document.getElementById('uploadImageBtn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const img = new Image();
          img.src = ev.target.result;
          img.onload = () => {
            const maxWidth = 800;
            let width = img.width, height = img.height;
            if (width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            const base64 = canvas.toDataURL(file.type, 0.8);
            const noteInput = document.getElementById('noteInput');
            noteInput.value += `\n![图片](${base64})`;
          };
        };
        reader.readAsDataURL(file);
      };
      input.click();
    });

    // 事件绑定
    document.getElementById('tokenInput').value = githubToken;
    document.getElementById('saveTokenBtn').addEventListener('click',()=>{
      const token = document.getElementById('tokenInput').value.trim();
      if(token){ githubToken=token; localStorage.setItem('githubToken',token); alert('Token已保存'); }
    });

    document.getElementById('startBtn').addEventListener('click', async ()=>{
      if (!githubToken) { const token = document.getElementById('tokenInput').value.trim(); if (!token) return alert('请先输入 GitHub Token'); githubToken = token; localStorage.setItem('githubToken', token); }
      let text = '';
      try { text = await loadQuizText(); } catch(e) { return; }
      if (!text.trim()) return alert('题库内容为空');
      allQuestions = parseQuestions(text);
      if (!allQuestions.length) return alert('未解析到有效题目');
      chapters = ['全部题目', ...new Set(allQuestions.map(q=>q.chapter))];
      const sel = document.getElementById('chapterSelect');
      sel.innerHTML = chapters.map(c=>`<option>${c}</option>`).join('');
      sel.value = selectedChapter;

      try {
        document.getElementById('loadingStatus').innerText = '正在从云端恢复记录...';
        await loadProgressFromRepo(3);
      } catch (e) {
        alert(e.message);
        return;
      }
      sel.value = selectedChapter;
      startAutoSync();
      updateSyncTimeDisplay();
      document.getElementById('importPage').classList.add('hidden');
      document.getElementById('quizPage').classList.remove('hidden');
      updateModeButtons();
      renderQuestion();
    });

    document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>switchMode(b.dataset.mode)));
    document.getElementById('submitBtn').addEventListener('click', submitAnswer);
    document.getElementById('nextBtn').addEventListener('click',nextQuestion);
    document.getElementById('prevBtn').addEventListener('click',prevQuestion);
    document.getElementById('toggleNoteBtn').addEventListener('click',()=>document.getElementById('notePanel').classList.toggle('hidden'));
    document.getElementById('addAnalysisBtn').addEventListener('click', async ()=>{
      const q=getCurrentQuestions()[currentIndex]; if(!q)return;
      const text=document.getElementById('noteInput').value.trim(); if(!text)return;
      if(q.analysis) q.analysis+='\n\n'+text; else q.analysis=text;
      document.getElementById('noteInput').value=''; saveState(); renderQuestion();
      saveQuizToGitHub(true);
    });
    document.getElementById('exportWrongBtn').addEventListener('click',()=>{
      const wrong=allQuestions.filter(q=>wrongSet.has(q.originalIndex)); if(!wrong.length)return alert('暂无错题');
      let md='# 错题本\n\n'; wrong.forEach((q,i)=>{
        md+=`**${i+1}. ${q.title}**\n\n`;
        for(const [k,v] of Object.entries(q.options)) md+=`- **${k}**. ${v}\n`;
        md+=`\n**正确答案**：${q.answer}\n\n**解析**：\n${q.analysis||'无'}\n\n---\n\n`;
      }); downloadFile('错题本.md',md);
    });
    document.getElementById('saveQuizBtn').addEventListener('click', ()=>saveQuizToGitHub(false));
    document.getElementById('syncBtn').addEventListener('click',()=>syncProgressToRepo(false));
    document.getElementById('clearRecordBtn').addEventListener('click',clearCurrentModeRecords);
    document.getElementById('clearCacheBtn').addEventListener('click',()=>{ if(confirm('确定清除所有记录和题库吗？')){ localStorage.clear(); location.reload(); } });
    document.getElementById('goBtn').addEventListener('click',()=>{ const n=parseInt(document.getElementById('jumpInput').value); const qs=getCurrentQuestions(); if(n>=1&&n<=qs.length){ currentIndex=n-1; saveState(); renderQuestion(); } else alert('题号超出范围'); });
    document.getElementById('chapterSelect').addEventListener('change',(e)=>{ selectedChapter=e.target.value; currentIndex=0; thumbPage=0; saveState(); renderQuestion(); });
    document.getElementById('prevGroupBtn').addEventListener('click',()=>{ if(thumbPage>0) thumbPage--; renderThumbnails(getCurrentQuestions()); });
    document.getElementById('nextGroupBtn').addEventListener('click',()=>{ thumbPage++; renderThumbnails(getCurrentQuestions()); });
    document.getElementById('statsBtn').addEventListener('click', showStats);
    document.getElementById('closeStatsBtn').addEventListener('click', closeStats);

    updateSyncTimeDisplay();
  </script>
</body>
</html>
