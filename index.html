<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全能刷题工具</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0052d9">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f7fa; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #importPage, #quizPage { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 20px; }
    #quizPage { padding: 10px; }
    .hidden { display: none !important; }
    #importPage textarea { flex: 1; min-height: 200px; margin: 10px 0; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    .btn-primary { background: #0052d9; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 16px; cursor: pointer; }
    .stats-row { display: flex; align-items: center; background: white; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
    .progress-bar { flex: 1; height: 10px; background: #e0e0e0; border-radius: 5px; margin-right: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: #0052d9; width: 0%; }
    .stat-item { font-size: 14px; margin: 0 5px; white-space: nowrap; }
    .mode-row { display: flex; flex-wrap: wrap; align-items: center; background: white; padding: 8px; border-radius: 8px; margin-bottom: 8px; }
    .mode-btn { padding: 6px 12px; margin: 2px; border: 1px solid #0052d9; background: white; color: #0052d9; border-radius: 20px; font-size: 14px; cursor: pointer; }
    .mode-btn.active { background: #0052d9; color: white; }
    .action-btn { padding: 6px 12px; margin: 2px; border: 1px solid #ccc; background: white; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .danger-btn { color: #d54941; border-color: #d54941; }
    .jump-row { display: flex; align-items: center; background: white; padding: 8px; border-radius: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .jump-row select, .jump-row input { padding: 6px; border-radius: 4px; border: 1px solid #ccc; margin: 2px; font-size: 14px; }
    .jump-row button { padding: 6px 10px; margin: 2px; background: #0052d9; color: white; border: none; border-radius: 4px; }
    .thumbnails { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin: 2px 0; flex: 1; overflow-x: auto; }
    .thumb-cell { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border-radius: 3px; cursor: pointer; border: 1px solid #ccc; background: #eee; }
    .thumb-cell.current { border: 2px solid #0052d9; }
    .thumb-cell.correct { background: #b7eb8f; }
    .thumb-cell.wrong { background: #ffa39e; }
    .question-card { background: white; padding: 20px; border-radius: 12px; flex: 1; overflow-y: auto; }
    .option-row { display: flex; align-items: center; padding: 12px; margin: 5px 0; border: 1px solid #e5e6eb; border-radius: 8px; cursor: pointer; }
    .option-key { width: 24px; height: 24px; background: #f5f7fa; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 10px; }
    .option-selected { border-color: #0052d9; background: #e8f3ff; }
    .option-selected .option-key { background: #0052d9; color: white; }
    .option-correct { border-color: #2ba471; background: #e8f8f0; }
    .option-correct .option-key { background: #2ba471; color: white; }
    .option-wrong { border-color: #d54941; background: #fdecec; }
    .option-wrong .option-key { background: #d54941; color: white; }
    .result-box { margin-top: 15px; padding: 10px; background: #fafafa; border-radius: 8px; }
    .bottom-bar { display: flex; justify-content: center; gap: 10px; padding: 10px 0; }
    .note-panel { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; margin: 10px 0; }
    textarea { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <div id="importPage">
    <h2 style="text-align:center; color:#0052d9;">全能刷题工具</h2>
    <p style="text-align:center; color:#666;">粘贴题库或上传文件，开始刷题</p>
    <textarea id="quizInput" placeholder="在此粘贴题库内容..."></textarea>
    <input type="file" id="fileInput" accept=".md,.txt" style="display:none;">
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn-primary" id="fileBtn" style="flex:1;">上传文件</button>
      <button class="btn-primary" id="startBtn" style="flex:1;">开始刷题</button>
    </div>
  </div>

  <div id="quizPage" class="hidden">
    <div class="stats-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="stat-item" id="correctStat">正确:0</span>
      <span class="stat-item" id="accuracyStat">正确率:0%</span>
      <span class="stat-item" id="progressStat">0/0</span>
    </div>

    <div class="mode-row">
      <button class="mode-btn active" data-mode="sequence">顺序</button>
      <button class="mode-btn" data-mode="random">随机</button>
      <button class="mode-btn" data-mode="wrong">错题本</button>
      <button class="action-btn" id="exportWrongBtn">导出错题</button>
      <button class="action-btn" id="saveQuizBtn">保存题库</button>
      <button class="action-btn" id="saveAsBtn">另存为</button>
      <button class="action-btn" id="syncBtn">🔄 同步到GitHub</button>
      <button class="action-btn" id="clearRecordBtn">清空做题记录</button>
      <button class="action-btn danger-btn" id="clearCacheBtn">清除缓存</button>
    </div>

    <div class="jump-row">
      <select id="chapterSelect" style="width:120px;"></select>
      <input type="number" id="jumpInput" placeholder="题号" style="width:60px;">
      <button id="goBtn">Go</button>
      <div class="thumbnails" id="thumbContainer"></div>
      <button id="prevGroupBtn" class="action-btn">上一组</button>
      <button id="nextGroupBtn" class="action-btn">下一组</button>
    </div>

    <div class="question-card" id="questionCard">
      <div id="qType" style="display:inline-block; padding:4px 10px; border-radius:4px; font-weight:bold; margin-bottom:10px;">单选题</div>
      <div id="qNumber" style="margin-bottom:10px;">第1题</div>
      <div id="qTitle" style="font-size:16px; margin-bottom:15px;"></div>
      <div id="optionsContainer"></div>
      <div id="resultContainer" class="result-box hidden"></div>
    </div>

    <div id="notePanel" class="note-panel hidden">
      <div id="noteContent" style="max-height:120px; overflow-y:auto; margin-bottom:8px;"></div>
      <textarea id="noteInput" placeholder="输入新解析内容（可粘贴HTML表格）..." rows="2"></textarea>
      <button class="btn-primary" id="addAnalysisBtn" style="margin-top:5px;">添加解析</button>
    </div>

    <div class="bottom-bar">
      <button class="action-btn" id="prevBtn">← 上一题</button>
      <button class="btn-primary" id="submitBtn">提交答案</button>
      <button class="btn-primary" id="nextBtn" style="display:none;">下一题 →</button>
      <button class="action-btn" id="toggleNoteBtn">笔记</button>
    </div>
  </div>

  <script>
    // ========== 全局状态 ==========
    let allQuestions = [];
    let currentMode = 'sequence';
    let wrongSet = new Set();
    let modeAnswers = {};
    let modeSubmitted = {};
    let wrongAnswers = {};
    let wrongSubmitted = {};
    let currentIndex = 0;
    let totalAnswered = 0, totalCorrect = 0;
    let chapters = ['全部题目'];
    let selectedChapter = '全部题目';
    let thumbPage = 0;
    let thumbItemsPerPage = 20;
    let notes = {};
    let gistId = null;           // 存储Gist ID
    let githubToken = '';

    // ========== 题库解析 ==========
    function parseQuestions(text) {
      text = text.replace(/```[a-z]*\n?/g, '').replace(/#{1,6}\s*/g, '')
                 .replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1')
                 .replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const lines = text.split('\n');
      const questions = [];
      let currentQ = null;
      let globalId = 0;
      let isReadingAnalysis = false;
      let currentChapter = '默认章节';
      const chapterSet = new Set(['全部题目', currentChapter]);

      for (let rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;
        if (/^.+?[（(]约\d+道[）)]$/.test(line) || /^第[一二三四五六七八九十\d]+章\s*.+$/.test(line)) {
          currentChapter = line.replace(/[（(]约\d+道[）)]/, '').trim();
          chapterSet.add(currentChapter);
          continue;
        }
        if (/^\d+[.、．]\s*(.*)/.test(line)) {
          if (currentQ && currentQ.answer) questions.push(currentQ);
          const title = line.replace(/^\d+[.、．]\s*/, '');
          currentQ = { originalIndex: globalId++, chapter: currentChapter, title, options: {}, answer: '', isMulti: false, analysis: '' };
          isReadingAnalysis = false;
          continue;
        }
        if (!currentQ) continue;
        if (/^[A-Ea-e][.、．\s]\s*(.*)/.test(line) && !isReadingAnalysis) {
          const key = line[0].toUpperCase();
          const val = line.substring(1).replace(/^[.、．\s]+/, '');
          currentQ.options[key] = val;
          continue;
        }
        if (/^(正确答案|答案)[：:]\s*([A-Ea-e,\s]+)/.test(line)) {
          const ansStr = line.replace(/^(正确答案|答案)[：:]\s*/, '').replace(/[^A-Ea-e]/g, '').toUpperCase();
          currentQ.answer = ansStr.split('').sort().join('');
          currentQ.isMulti = currentQ.answer.length > 1;
          continue;
        }
        if (/^解析[：:]\s*(.*)/.test(line)) {
          currentQ.analysis = line.replace(/^解析[：:]\s*/, '');
          isReadingAnalysis = true;
          continue;
        }
        if (isReadingAnalysis && currentQ) currentQ.analysis += '\n' + line;
      }
      if (currentQ && currentQ.answer) questions.push(currentQ);
      return questions;
    }

    // ========== 本地持久化 + 同步GitHub ==========
    function saveState() {
      const state = {
        modeAnswers, modeSubmitted, wrongAnswers, wrongSubmitted,
        wrongSet: Array.from(wrongSet), totalAnswered, totalCorrect,
        notes, currentMode, selectedChapter, currentIndex
      };
      localStorage.setItem('quizState', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('quizState');
      if (!saved) return false;
      try {
        const state = JSON.parse(saved);
        modeAnswers = state.modeAnswers || {};
        modeSubmitted = state.modeSubmitted || {};
        wrongAnswers = state.wrongAnswers || {};
        wrongSubmitted = state.wrongSubmitted || {};
        wrongSet = new Set(state.wrongSet || []);
        totalAnswered = state.totalAnswered || 0;
        totalCorrect = state.totalCorrect || 0;
        notes = state.notes || {};
        currentMode = state.currentMode || 'sequence';
        selectedChapter = state.selectedChapter || '全部题目';
        currentIndex = state.currentIndex || 0;
        return true;
      } catch (e) { return false; }
    }

    function clearAllData() {
      localStorage.removeItem('quizState');
      localStorage.removeItem('githubToken');
      localStorage.removeItem('gistId');
      allQuestions = [];
      wrongSet.clear();
      modeAnswers = {}; modeSubmitted = {};
      wrongAnswers = {}; wrongSubmitted = {};
      totalAnswered = totalCorrect = 0;
      notes = {};
      gistId = null;
      githubToken = '';
    }

    // ========== GitHub Gist 同步 ==========
    async function syncToGist() {
      if (!githubToken) {
        githubToken = prompt('请输入你的 GitHub 个人访问令牌 (需要 gist 权限):\n如果没有，请点击下方按钮生成→ https://github.com/settings/tokens/new?scopes=gist') || '';
        if (!githubToken) return;
        localStorage.setItem('githubToken', githubToken);
      }
      const data = {
        modeAnswers, modeSubmitted, wrongAnswers, wrongSubmitted,
        wrongSet: Array.from(wrongSet), totalAnswered, totalCorrect,
        notes, currentMode, selectedChapter, currentIndex
      };
      const content = JSON.stringify(data);
      const headers = {
        'Authorization': `token ${githubToken}`,
        'Content-Type': 'application/json'
      };

      try {
        if (gistId) {
          // 更新已有Gist
          const res = await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers,
            body: JSON.stringify({ files: { 'quiz-state.json': { content } } })
          });
          if (res.ok) alert('同步成功！');
          else throw new Error('更新失败');
        } else {
          // 创建新Gist
          const res = await fetch('https://api.github.com/gists', {
            method: 'POST',
            headers,
            body: JSON.stringify({
              description: '全能刷题工具数据备份',
              public: false,
              files: { 'quiz-state.json': { content } }
            })
          });
          if (res.ok) {
            const json = await res.json();
            gistId = json.id;
            localStorage.setItem('gistId', gistId);
            alert('备份已创建，后续点击同步将自动更新');
          } else throw new Error('创建失败');
        }
      } catch (e) {
        alert('同步失败: ' + e.message + '\n请检查Token是否正确或网络连接');
      }
    }

    async function loadFromGist() {
      if (!gistId && !localStorage.getItem('gistId')) return false;
      if (!gistId) gistId = localStorage.getItem('gistId');
      if (!githubToken) githubToken = localStorage.getItem('githubToken');
      if (!githubToken) return false;
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: { 'Authorization': `token ${githubToken}` }
        });
        if (res.ok) {
          const json = await res.json();
          const content = json.files['quiz-state.json']?.content;
          if (content) {
            const data = JSON.parse(content);
            modeAnswers = data.modeAnswers || {};
            modeSubmitted = data.modeSubmitted || {};
            wrongAnswers = data.wrongAnswers || {};
            wrongSubmitted = data.wrongSubmitted || {};
            wrongSet = new Set(data.wrongSet || []);
            totalAnswered = data.totalAnswered || 0;
            totalCorrect = data.totalCorrect || 0;
            notes = data.notes || {};
            currentMode = data.currentMode || 'sequence';
            selectedChapter = data.selectedChapter || '全部题目';
            currentIndex = data.currentIndex || 0;
            saveState();
            return true;
          }
        }
      } catch (e) {}
      return false;
    }

    // ========== 界面逻辑 ==========
    document.getElementById('startBtn').addEventListener('click', async () => {
      const text = document.getElementById('quizInput').value;
      if (!text.trim()) return alert('请粘贴题库内容');
      allQuestions = parseQuestions(text);
      if (!allQuestions.length) return alert('未解析到有效题目');
      chapters = ['全部题目', ...new Set(allQuestions.map(q => q.chapter))];
      const chapterSelect = document.getElementById('chapterSelect');
      chapterSelect.innerHTML = chapters.map(c => `<option>${c}</option>`).join('');
      chapterSelect.value = selectedChapter;
      // 先尝试从Gist恢复，再本地加载
      githubToken = localStorage.getItem('githubToken') || '';
      gistId = localStorage.getItem('gistId') || null;
      const restored = await loadFromGist();
      if (!restored) loadState();
      document.getElementById('importPage').classList.add('hidden');
      document.getElementById('quizPage').classList.remove('hidden');
      updateModeButtons();
      renderQuestion();
    });

    function getCurrentQuestions() {
      let base = selectedChapter === '全部题目' ? [...allQuestions] : allQuestions.filter(q => q.chapter === selectedChapter);
      if (currentMode === 'random') shuffle(base);
      else if (currentMode === 'wrong') {
        base = base.filter(q => wrongSet.has(q.originalIndex));
        shuffle(base);
      }
      return base;
    }

    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }

    function getEffectiveAnswer(q) {
      if (currentMode === 'wrong') return wrongAnswers[q.originalIndex] || '';
      return (modeAnswers[currentMode] || {})[q.originalIndex] || '';
    }
    function isSubmitted(q) {
      if (currentMode === 'wrong') return !!wrongSubmitted[q.originalIndex];
      return !!((modeSubmitted[currentMode] || {})[q.originalIndex]);
    }
    function setAnswer(q, answer) {
      if (currentMode === 'wrong') wrongAnswers[q.originalIndex] = answer;
      else { if (!modeAnswers[currentMode]) modeAnswers[currentMode] = {}; modeAnswers[currentMode][q.originalIndex] = answer; }
    }
    function setSubmitted(q, val = true) {
      if (currentMode === 'wrong') wrongSubmitted[q.originalIndex] = val;
      else { if (!modeSubmitted[currentMode]) modeSubmitted[currentMode] = {}; modeSubmitted[currentMode][q.originalIndex] = val; }
    }

    function renderQuestion() {
      const questions = getCurrentQuestions();
      if (!questions.length) {
        document.getElementById('qTitle').innerText = '暂无题目';
        document.getElementById('optionsContainer').innerHTML = '';
        document.getElementById('resultContainer').classList.add('hidden');
        document.getElementById('submitBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').style.display = 'none';
        updateStats(questions);
        renderThumbnails(questions);
        return;
      }
      if (currentIndex >= questions.length) currentIndex = questions.length - 1;
      if (currentIndex < 0) currentIndex = 0;
      const q = questions[currentIndex];
      document.getElementById('qTitle').innerText = q.title;
      document.getElementById('qType').innerText = q.isMulti ? '多选题' : '单选题';
      document.getElementById('qType').style.background = q.isMulti ? '#fff7e6' : '#e8f3ff';
      document.getElementById('qNumber').innerText = `第 ${currentIndex+1} 题 / 共 ${questions.length} 题 (全局:${q.originalIndex+1})`;

      const optsDiv = document.getElementById('optionsContainer');
      optsDiv.innerHTML = '';
      const effAnswer = getEffectiveAnswer(q);
      const submitted = isSubmitted(q);

      for (const [key, val] of Object.entries(q.options)) {
        const row = document.createElement('div');
        row.className = 'option-row';
        if (submitted) {
          if (q.answer.includes(key)) row.classList.add('option-correct');
          else if (effAnswer.includes(key)) row.classList.add('option-wrong');
        } else if (effAnswer.includes(key)) row.classList.add('option-selected');
        row.innerHTML = `<span class="option-key">${key}</span><span>${val}</span>`;
        row.addEventListener('click', () => selectOption(q, key));
        optsDiv.appendChild(row);
      }

      document.getElementById('resultContainer').classList.add('hidden');
      if (submitted) {
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'inline-block';
        showResult(q, effAnswer);
      } else {
        document.getElementById('submitBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').style.display = 'none';
      }
      updateStats(questions);
      renderThumbnails(questions);
    }

    function selectOption(q, key) {
      if (isSubmitted(q)) return;
      let ans = getEffectiveAnswer(q);
      if (q.isMulti) ans = ans.includes(key) ? ans.replace(key, '') : (ans + key).split('').sort().join('');
      else ans = key;
      setAnswer(q, ans);
      renderQuestion();
    }

    function showResult(q, effAnswer) {
      const correct = effAnswer === q.answer;
      const resultDiv = document.getElementById('resultContainer');
      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `<div style="font-weight:bold; color:${correct?'#2ba471':'#d54941'}">${correct ? '✔ 回答正确！' : '✘ 回答错误！正确答案：' + q.answer}</div><div style="font-weight:bold; margin-top:10px;">解析：</div><div style="white-space:pre-wrap;">${q.analysis || '无'}</div>`;
    }

    function submitAnswer() {
      const questions = getCurrentQuestions();
      if (!questions.length) return;
      const q = questions[currentIndex];
      const effAnswer = getEffectiveAnswer(q);
      if (!effAnswer) return alert('请先选择答案');
      if (currentMode === 'wrong') {
        wrongSubmitted[q.originalIndex] = true;
        if (effAnswer === q.answer) {
          q.wrongCorrectCount = (q.wrongCorrectCount || 0) + 1;
          if (q.wrongCorrectCount >= 10) wrongSet.delete(q.originalIndex);
        }
      } else {
        setSubmitted(q);
        totalAnswered++;
        if (effAnswer === q.answer) { totalCorrect++; wrongSet.delete(q.originalIndex); }
        else wrongSet.add(q.originalIndex);
      }
      saveState();
      renderQuestion();
    }

    function nextQuestion() {
      const questions = getCurrentQuestions();
      if (!isSubmitted(questions[currentIndex])) return alert('请先提交当前题目');
      if (currentIndex < questions.length - 1) currentIndex++;
      else return alert('已经是最后一题');
      saveState();
      renderQuestion();
    }

    function prevQuestion() {
      const questions = getCurrentQuestions();
      if (!isSubmitted(questions[currentIndex])) return alert('请先提交当前题目');
      if (currentIndex > 0) currentIndex--;
      else return alert('已经是第一题');
      saveState();
      renderQuestion();
    }

    function switchMode(mode) {
      if (currentMode !== mode) {
        currentMode = mode;
        currentIndex = 0;
        thumbPage = 0;
        saveState();
        updateModeButtons();
        renderQuestion();
      }
    }

    function updateModeButtons() {
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === currentMode));
    }

    function clearCurrentModeRecords() {
      if (currentMode === 'wrong') { wrongAnswers = {}; wrongSubmitted = {}; }
      else {
        const sub = modeSubmitted[currentMode];
        if (sub) {
          let cleared = 0, clearedCorrect = 0;
          const ans = modeAnswers[currentMode] || {};
          for (const idx in sub) {
            if (sub[idx]) {
              cleared++;
              const q = allQuestions.find(q => q.originalIndex == idx);
              if (q && ans[idx] === q.answer) clearedCorrect++;
            }
          }
          totalAnswered -= cleared;
          totalCorrect -= clearedCorrect;
          delete modeAnswers[currentMode];
          delete modeSubmitted[currentMode];
        }
      }
      saveState();
      renderQuestion();
      alert('当前模式做题记录已清空');
    }

    function renderThumbnails(questions) {
      const container = document.getElementById('thumbContainer');
      container.innerHTML = '';
      if (!questions.length) return;
      const containerWidth = container.clientWidth || 300;
      thumbItemsPerPage = Math.max(1, Math.floor((containerWidth + 3) / 33));
      const totalPages = Math.ceil(questions.length / thumbItemsPerPage);
      if (thumbPage >= totalPages) thumbPage = totalPages - 1;
      if (thumbPage < 0) thumbPage = 0;
      const start = thumbPage * thumbItemsPerPage;
      const end = Math.min(start + thumbItemsPerPage, questions.length);
      for (let i = start; i < end; i++) {
        const q = questions[i];
        const cell = document.createElement('div');
        cell.className = 'thumb-cell';
        cell.innerText = i + 1;
        if (i === currentIndex) cell.classList.add('current');
        const submitted = isSubmitted(q);
        if (submitted) {
          const effAnswer = getEffectiveAnswer(q);
          cell.classList.add(effAnswer === q.answer ? 'correct' : 'wrong');
        }
        cell.addEventListener('click', () => { currentIndex = i; saveState(); renderQuestion(); });
        container.appendChild(cell);
      }
    }

    // 事件绑定
    document.querySelectorAll('.mode-btn').forEach(btn => btn.addEventListener('click', () => switchMode(btn.dataset.mode)));
    document.getElementById('submitBtn').addEventListener('click', submitAnswer);
    document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    document.getElementById('prevBtn').addEventListener('click', prevQuestion);
    document.getElementById('toggleNoteBtn').addEventListener('click', () => document.getElementById('notePanel').classList.toggle('hidden'));
    document.getElementById('addAnalysisBtn').addEventListener('click', () => {
      const q = getCurrentQuestions()[currentIndex];
      if (!q) return;
      const text = document.getElementById('noteInput').value.trim();
      if (!text) return;
      if (q.analysis) q.analysis += '\n\n' + text;
      else q.analysis = text;
      document.getElementById('noteInput').value = '';
      saveState();
      renderQuestion();
      alert('解析已添加');
    });
    document.getElementById('exportWrongBtn').addEventListener('click', () => {
      const wrongQuestions = allQuestions.filter(q => wrongSet.has(q.originalIndex));
      if (!wrongQuestions.length) return alert('暂无错题');
      let md = '# 错题本\n\n';
      wrongQuestions.forEach((q, i) => {
        md += `**${i+1}. ${q.title}**\n\n`;
        for (const [k, v] of Object.entries(q.options)) md += `- **${k}**. ${v}\n`;
        md += `\n**正确答案**：${q.answer}\n\n`;
        md += `**解析**：\n${q.analysis || '无'}\n\n---\n\n`;
      });
      downloadFile('错题本.md', md);
    });
    document.getElementById('saveQuizBtn').addEventListener('click', () => {
      let md = '# 题库\n\n';
      const chapters = [...new Set(allQuestions.map(q => q.chapter))];
      chapters.forEach(ch => {
        md += `## ${ch}\n\n`;
        allQuestions.filter(q => q.chapter === ch).forEach(q => {
          md += `${q.originalIndex+1}. ${q.title}\n\n`;
          for (const [k, v] of Object.entries(q.options)) md += `${k}. ${v}\n`;
          md += `\n答案：${q.answer}\n\n`;
          if (q.analysis) md += `解析：\n${q.analysis}\n\n`;
          md += '\n';
        });
      });
      downloadFile('题库.md', md);
    });
    document.getElementById('saveAsBtn').addEventListener('click', () => document.getElementById('saveQuizBtn').click());
    document.getElementById('syncBtn').addEventListener('click', syncToGist);
    document.getElementById('clearRecordBtn').addEventListener('click', clearCurrentModeRecords);
    document.getElementById('clearCacheBtn').addEventListener('click', () => { if (confirm('确定清除所有记录和题库吗？')) { clearAllData(); location.reload(); } });
    document.getElementById('fileBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => document.getElementById('quizInput').value = e.target.result;
      reader.readAsText(file);
    });
    document.getElementById('goBtn').addEventListener('click', () => {
      const num = parseInt(document.getElementById('jumpInput').value);
      const questions = getCurrentQuestions();
      if (num >= 1 && num <= questions.length) { currentIndex = num - 1; saveState(); renderQuestion(); }
      else alert('题号超出范围');
    });
    document.getElementById('chapterSelect').addEventListener('change', (e) => { selectedChapter = e.target.value; currentIndex = 0; thumbPage = 0; saveState(); renderQuestion(); });
    document.getElementById('prevGroupBtn').addEventListener('click', () => { if (thumbPage > 0) thumbPage--; renderThumbnails(getCurrentQuestions()); });
    document.getElementById('nextGroupBtn').addEventListener('click', () => { thumbPage++; renderThumbnails(getCurrentQuestions()); });

    function downloadFile(filename, text) {
      const blob = new Blob([text], {type: 'text/markdown'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function updateStats(questions) {
      document.getElementById('correctStat').innerText = `正确:${totalCorrect}`;
      const acc = totalAnswered > 0 ? (totalCorrect / totalAnswered * 100).toFixed(0) : 0;
      document.getElementById('accuracyStat').innerText = `正确率:${acc}%`;
      document.getElementById('progressStat').innerText = `${totalAnswered}/${allQuestions.length}`;
      const progress = questions.length ? (currentIndex + 1) / questions.length : 0;
      document.getElementById('progressFill').style.width = (progress * 100) + '%';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
